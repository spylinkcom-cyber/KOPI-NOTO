<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KOPI NOTO POS</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>KOPI NOTO POS</h1>

<div class="info">
<p id="tanggal"></p>
<p id="jam"></p>
</div>

</header>

<section class="login">

<h2>Login Kasir</h2>

<input type="text" id="kasir" placeholder="Nama Kasir">

<button onclick="loginKasir()">Masuk</button>

</section>

<section class="dashboard">

<div class="card">
<h3>Modal Hari</h3>
<input type="number" id="modal">
</div>

<div class="card">
<h3>Pemasukan Dini Hari</h3>
<input type="number" id="pemasukanLain">
</div>

<div class="card">
<h3>Pengeluaran</h3>

<input type="text" id="namaPengeluaran" placeholder="Keterangan">

<input type="number" id="jumlahPengeluaran">

<button onclick="tambahPengeluaran()">
Tambah
</button>

</div>

</section>

<section class="stok">

<h2>Stok Awal</h2>

<label>Kopi Siap Jual</label>

<input type="number" id="stokCoffee">

<label>Tea</label>

<input type="number" id="stokTea">

<label>Non Coffee</label>

<input type="number" id="stokNon">

<label>Susu Dibawa</label>

<select id="stokSusu">

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>

</select>

<label>Sisa Susu</label>

<select id="sisaSusu">

<option>Full</option>
<option>3/4</option>
<option>1/2</option>
<option>1/3</option>
<option>1/4</option>
<option>Habis</option>

</select>

<label>Es (Kg)</label>

<input type="number" id="stokEs">

<label>Air Botol</label>

<input type="number" id="stokAir">

</section>

<section>

<h2>Daftar Menu</h2>

<div id="menuContainer"></div>

</section>

<section>

<h2>Keranjang</h2>

<table>

<thead>

<tr>

<th>Menu</th>

<th>Qty</th>

<th>Harga</th>

<th>Total</th>

</tr>

</thead>

<tbody id="cart">

</tbody>

</table>

<h2 id="grandTotal">
Rp0
</h2>

</section>

<section>

<h2>Pembayaran</h2>

<select id="metode">

<option>Tunai</option>

<option>QRIS</option>

</select>

<input
type="number"
id="bayar"
placeholder="Uang Bayar">

<button onclick="hitungBayar()">

Hitung

</button>

<h3 id="kembalian">

Rp0

</h3>

<button onclick="simpanTransaksi()">

Simpan Transaksi

</button>

</section>

<section>

<button onclick="laporanBuka()">

Laporan Buka Shift

</button>

<button onclick="laporanTutup()">

Laporan Tutup Shift

</button>

<button onclick="kirimWA()">

Kirim WhatsApp

</button>

</section>

<section>

<h2>Riwayat</h2>

<div id="history">

</div>

</section>

<script src="script.js"></script>

</body>
</html>
